{{- $backendTlsHostname := include "site-manager.ingress.host" . -}}
{{- if and (contains "gateway-api-default" (include "site-manager.gatewaySystemType" .)) .Values.tls.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ .Chart.Name }}-backend-tls
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/component: 'backend'
    app.kubernetes.io/part-of: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ .Chart.Name }}
  validation:
    hostname: {{ $backendTlsHostname | quote }}
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: sm-certs
{{- end }}
