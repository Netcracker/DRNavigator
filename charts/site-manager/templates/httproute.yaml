{{- if contains "gateway-api-default" (include "site-manager.gatewaySystemType" .) -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/component: 'backend'
    app.kubernetes.io/part-of: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.GATEWAY_SYSTEM_NAME  | quote }}
      namespace: {{ .Values.GATEWAY_SYSTEM_NAMESPACE | quote }}
  hostnames:
    - {{ include "site-manager.ingress.host" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Chart.Name }}
          port: 443
          weight: 1
{{- end }}
