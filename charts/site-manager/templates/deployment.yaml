---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.SERVICE_NAME }}
  labels:
    name: site-manager
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/instance: '{{ cat (coalesce .Values.DEPLOYMENT_RESOURCE_NAME .Values.SERVICE_NAME) "-" .Values.NAMESPACE | nospace | trunc 63 | trimSuffix "-" }}'
    app.kubernetes.io/version: '{{ .Values.ARTIFACT_DESCRIPTOR_VERSION }}'
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    app.kubernetes.io/technology: go
  {{- end }}
spec:
  selector:
    matchLabels:
      app: site-manager
  replicas: 1
  template:
    metadata:
      labels:
        app: site-manager
        {{- if .Values.SERVICE_NAME }}
        name: site-manager
        app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
        app.kubernetes.io/instance: '{{ cat (coalesce .Values.DEPLOYMENT_RESOURCE_NAME .Values.SERVICE_NAME) "-" .Values.NAMESPACE | nospace | trunc 63 | trimSuffix "-" }}'
        app.kubernetes.io/version: '{{ .Values.ARTIFACT_DESCRIPTOR_VERSION }}'
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: '{{ .Values.SERVICE_NAME }}'
        app.kubernetes.io/technology: go
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      automountServiceAccountToken: false
      {{ include  "securityContext" . }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          runAsNonRoot: true
          {{- if eq (default "" .Values.PAAS_PLATFORM) "KUBERNETES" }}
          runAsUser: 1001
          runAsGroup: 1001
          {{- end }}
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
        image: {{ template "find_image" (dict "SERVICE_NAME" "site-manager" "vals" .Values "default" .Values.image) }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        args:
          - "--bind=0.0.0.0:8443"
          - "--certdir=/certs"
          - "--certfile=tls.crt"
          - "--keyfile=tls.key"
          - "--tokenfile=/rest-api/token"
          - "--bind-webhook=0.0.0.0:8442"
          - "--bind-metrics=0.0.0.0:9000"
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: HTTPS_ENABLED
            value: "{{ .Values.tls.enabled }}"
          - name: FRONT_HTTP_AUTH
            value: "{{ .Values.env.FRONT_HTTP_AUTH }}"
          - name: BACK_HTTP_AUTH
            value: "{{ .Values.env.BACK_HTTP_AUTH }}"
          - name: SM_DEBUG
            value: "{{ .Values.env.SM_DEBUG }}"
          - name: SM_GROUP
            value: "{{ .Values.env.SM_GROUP }}"
          - name: SM_KIND
            value: "{{ .Values.env.SM_KIND }}"
          - name: SM_KIND_LIST
            value: "{{ .Values.env.SM_KIND_LIST }}"
          - name: HTTP_SCHEME
            value: "{{ .Values.env.HTTP_SCHEME }}"
          - name: SM_CACERT
            value: "{{ .Values.env.SM_CACERT }}"
          - name: SM_GET_REQUEST_TIMEOUT
            value: "{{ .Values.env.SM_GET_REQUEST_TIMEOUT }}"
          - name: SM_POST_REQUEST_TIMEOUT
            value: "{{ .Values.env.SM_POST_REQUEST_TIMEOUT }}"
        ports:
          - containerPort: 8443
            protocol: TCP
          - containerPort: 8442
            protocol: TCP
        volumeMounts:
          - readOnly: true
            mountPath: /certs
            name: sm-certs
          - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            name: serviceaccount-token
            readOnly: true
          - mountPath: /rest-api
            name: rest-api-token
            readOnly: true
          - mountPath: /tmp
            name: tmp
        resources:
          limits:
            cpu: "{{ .Values.limits.cpu }}"
            memory: "{{ .Values.limits.memory }}"
          requests:
            cpu: "{{ .Values.requests.cpu }}"
            memory: "{{ .Values.requests.memory }}"
        readinessProbe:
          httpGet:
            path: /health
            port: 8443
            scheme: {{ ternary "HTTPS" "HTTP" .Values.tls.enabled }}
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 2
          successThreshold: 1
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8443
            scheme: {{ ternary "HTTPS" "HTTP" .Values.tls.enabled }}
          timeoutSeconds: 2
          periodSeconds: 20
          successThreshold: 1
          failureThreshold: 5
        terminationMessagePath: /dev/termination-log
        imagePullPolicy: {{ .Values.imagePullPolicy }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: sm-certs
          secret:
            secretName: sm-certs
        - name: rest-api-token
          {{- if .Values.smSecureAuth }}
          projected:
            defaultMode: 0444
            sources:
            - serviceAccountToken:
                expirationSeconds: 3607
                path: token
                {{- if .Values.customAudience }}
                audience: {{ .Values.customAudience }}
                {{- end }}
          {{- else }}
          secret:
            secretName: sm-auth-sa-token
          {{- end }}
        - name: serviceaccount-token
          projected:
            defaultMode: 0444
            sources:
            - serviceAccountToken:
                expirationSeconds: 3607
                path: token
            - configMap:
                name: kube-root-ca.crt
                items:
                - key: ca.crt
                  path: ca.crt
            - downwardAPI:
                items:
                - path: namespace
                  fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.namespace
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
