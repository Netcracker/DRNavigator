createClusterAdminEntities: true
priorityClassName: ""
profile: small

env:
  # set authentication mode
  FRONT_HTTP_AUTH: "True"
  BACK_HTTP_AUTH: "True"

  # set logging verbosity
  SM_DEBUG: "False"

  # set CRD parameters (for legacy API group only)
  SM_GROUP: "netcracker.com"
  SM_KIND: "SiteManager"
  SM_KIND_LIST: "SiteManagerList"
  # set HTTP scheme for microservices
  HTTP_SCHEME: "http://"

  # TLS verification in operators (True, False or path to CA file)
  SM_CACERT: "True"

  # Default timeouts for requests to services
  SM_GET_REQUEST_TIMEOUT: 10
  SM_POST_REQUEST_TIMEOUT: 30

# Pod Security Context
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault


serviceAccount:
  create: true
  name: site-manager-sa

smSecureAuth: false
customAudience: sm-services

MONITORING_ENABLED: true

SERVICE_NAME: site-manager

MANAGED_BY: saasDeployer

image: ghcr.io/netcracker/site-manager:test-verify1
imagePullPolicy: Always

ingress:
  create: true
  name: ""
  className: ""

# Gateway API (HTTPRoute) configuration.
# Resources are created only when:
# 1) gateway.networking.k8s.io/v1 CRDs are present
# 2) PAAS_PLATFORM=KUBERNETES
GATEWAY_SYSTEM_NAME: default-external-gateway
GATEWAY_SYSTEM_NAMESPACE: gateway-system

limits:
  cpu: "20m"
  memory: "100Mi"
requests:
  cpu: "20m"
  memory: "100Mi"

# A Kubernetes Affinity, if required.
#
# For example:
#   affinity:
#     nodeAffinity:
#      requiredDuringSchedulingIgnoredDuringExecution:
#        nodeSelectorTerms:
#        - matchExpressions:
#          - key: foo.bar.com/role
#            operator: In
#            values:
#            - worker
affinity: {}

tls:
  # This enables/disables HTTPS only for main site-manager endpoint.
  # NOTE: setting "enabled: false" does not affect webhooks, they still require TLS, so certs are ALWAYS required.
  enabled: true
  # Below fields allow to provide custom crt/key/ca certificates.
  # If you decide to use custom certificates, all three must be provided.
  # Otherwise, certificates will be generated using cert-manager (or openshift if you customize executor).
  crt: ""
  key: ""
  ca: ""
  defaultIngressTls: false
  generateCerts:
    executor: cert-manager
    clusterIssuerName: ""
    duration: 365
    subjectAlternativeName:
      additionalDnsNames: []
      additionalIpAddresses: []

PAAS_PLATFORM: KUBERNETES
DBAAS_ENABLED: false
CLOUD_PUBLIC_HOST: "example.com"

crd:
  install: false

paasGeoMonitor:
  image: ghcr.io/netcracker/paas-geo-monitor:test-verify1
  install: false
  monitoring:
    # This field configures service CIDR regex used on monitoring dashboard.
    # If you use a different service subnet (not starting with 172.), you need to specify regex appropriately.
    serviceCIDRRegex: 172.*
  env:
    PAAS_PING_PEERS: "true"
    PAAS_PING_TIME: "5"
    PAAS_DEBUG: "false"
    PAAS_BGP_METRICS: "true"
    PAAS_BGP_CHECK_PERIOD: "10"
    PAAS_BGP_CHECK_TIMEOUT: "30"
  config:
    peers: []
